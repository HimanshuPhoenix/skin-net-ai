sources:
  kin-mysql-source:
    kind: mysql
    host: ${DB_HOST}
    port: 3306
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    database: ${DB_NAME}

tools:
  get_user_medicine_inventory:
    kind: mysql-sql
    source: kin-mysql-source
    statement: |
      SELECT 
          m.medicine_name, 
          m.daily_dosage, 
          m.pills_remaining, 
          p.contact_name AS pharmacist_name,
          p.phone_number AS pharmacist_number
      FROM medicine_inventory m
      LEFT JOIN priority_contacts p ON m.pharmacist_contact_id = p.contact_id
      WHERE m.user_id = ?;
    description: |
      Use this tool to get the current medicine inventory and pharmacist contact numbers for a specific user.
    parameters:
      - name: user_id
        type: string
        description: The unique SSO user ID of the currently logged-in user.
toolsets:
  kin_db_toolset:
    - get_user_medicine_inventory

